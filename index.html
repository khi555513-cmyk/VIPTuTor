
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VIP English Tutor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- KaTeX for Math Support (Core only, manual rendering) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8" crossorigin="anonymous"></script>
    
    <!-- Highlight.js for Code Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        touch-action: pan-x pan-y; /* Disable double-tap zoom */
        -webkit-font-smoothing: antialiased;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 10px;
        transition: background 0.2s;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Advanced Animations */
      @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      
      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.9); }
        70% { transform: scale(1.02); }
        100% { opacity: 1; transform: scale(1); }
      }

      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      .animate-slide-up {
        animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .animate-pop-in {
        animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      .animate-fade-in {
        animation: slideUpFade 0.4s ease-out forwards;
      }
      
      @keyframes progress-indeterminate {
        0% { width: 0%; margin-left: 0; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }
      .animate-progress {
        animation: progress-indeterminate 1.5s infinite ease-in-out;
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .animate-shimmer {
        animation: shimmer 3s infinite linear;
      }
      
      /* Glassmorphism Utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      
      /* Markdown Styles (Kept Compact) */
      .markdown-content { font-size: 0.95rem; line-height: 1.7; color: #334155; }
      .markdown-content h1, .markdown-content h2, .markdown-content h3 { color: #0f172a; font-weight: 700; margin-top: 1.2em; margin-bottom: 0.6em; line-height: 1.3; }
      .markdown-content h1 { font-size: 1.5rem; }
      .markdown-content h2 { font-size: 1.25rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3rem; }
      .markdown-content p { margin-bottom: 0.8em; }
      .markdown-content ul, .markdown-content ol { margin-bottom: 0.8em; padding-left: 1.5em; }
      .markdown-content ul { list-style-type: disc; }
      .markdown-content table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 1em 0; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; }
      .markdown-content th, .markdown-content td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #e2e8f0; }
      .markdown-content th { background-color: #f8fafc; text-align: left; }
      .markdown-content :not(pre) > code { font-family: 'JetBrains Mono', monospace; font-size: 0.85em; background-color: #f1f5f9; padding: 0.2em 0.4em; border-radius: 0.375rem; color: #0f172a; border: 1px solid #e2e8f0; }
      .markdown-content pre { background-color: #1e293b; border-radius: 0.75rem; padding: 1rem; overflow-x: auto; margin: 1em 0; color: #e2e8f0; }
      .markdown-content blockquote { border-left: 4px solid #6366f1; margin: 1em 0; background: #eff6ff; padding: 0.8rem 1rem; border-radius: 0 0.5rem 0.5rem 0; color: #475569; }
      .markdown-content a { color: #4f46e5; text-decoration: none; font-weight: 600; }
      
      /* KaTeX */
      .katex { font-size: 1.1em; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "marked": "https://esm.sh/marked@12.0.0",
    "dompurify": "https://esm.sh/dompurify@3.0.9",
    "mammoth": "https://esm.sh/mammoth@1.6.0",
    "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.2"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 h-[100dvh] overflow-hidden selection:bg-indigo-100 selection:text-indigo-700">
    <div id="root"></div>
  </body>
</html>
